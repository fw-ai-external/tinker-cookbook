# Fireworks-specific settings for on-policy distillation setup.
fireworks_base_url: "https://api.fireworks.ai"

account: null  # Fireworks account ID (falls back to FIREWORKS_ACCOUNT_ID env var)

# Student model configuration.
model:
  name: accounts/pyroworks/models/qwen3-8b-base
  lora_rank: 128

# Teacher model configuration.
teacher:
  name: accounts/fireworks/models/qwen3-8b

training:
  learning_rate: 1e-5
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0
  max_length: null  # Auto-derived from student training shape if null

deployment:
  deployment_id: null
  deployment_shape: null  # Auto-derived from student training shape if null
  deployment_region: null
  deployment_accelerator_type: null
  hot_load_bucket_type: FW_HOSTED
  deployment_timeout_s: 5400
  deployment_extra_args: null
  tokenizer_model: Qwen/Qwen3-8B
  sample_timeout: 600
  disable_speculative_decoding: true
  extra_values: null
  replica_count: 4

training_infra:
  training_shape_id: accounts/fireworks/trainingShapes/qwen3-8b-256k-h200-lora
  training_job_id: null
  region: null
  custom_image_tag: null
  accelerator_type: null
  accelerator_count: null
  skip_validations: false
  node_count: 1
  extra_args: null

teacher_training_infra:
  training_shape_id: accounts/fireworks/trainingShapes/qwen3-8b-128k-forward-only
  training_job_id: null
  region: null
  custom_image_tag: null
  accelerator_type: null
  accelerator_count: null
  skip_validations: false
  node_count: 1
  extra_args: null

train_display_name: "qwen3-8b-student"
teacher_display_name: "qwen3-8b-teacher"
