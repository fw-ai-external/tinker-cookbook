# Fireworks-specific settings for on-policy distillation setup.
# Configured for the SDFT continual-learning recipe (run_continual_learning.py):
# 4B Qwen3-Instruct, full-param on a single-GPU B200 shape to keep cost low.
fireworks_base_url: "https://api.fireworks.ai"

account: null  # Fireworks account ID (falls back to FIREWORKS_ACCOUNT_ID env var)

# Student model configuration.
model:
  name: accounts/pyroworks/models/tinker-open-thoughts-qwen3p5-9b-merged
  lora_rank: 128  # full-param; the 1-GPU shape below is a full-param POLICY_TRAINER

# Teacher model configuration (self-distillation: same base as the student).
teacher:
  name: accounts/fireworks/models/qwen3p5-9b

training:
  learning_rate: 1e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0
  max_length: null  # Auto-derived from student training shape if null

deployment:
  deployment_id: null
  deployment_shape: null  # Auto-derived from student training shape if null
  deployment_region: null
  deployment_accelerator_type: null
  hot_load_bucket_type: FW_HOSTED
  deployment_timeout_s: 5400
  deployment_extra_args: null
  tokenizer_model: Qwen/Qwen3.5-9B
  sample_timeout: 600
  disable_speculative_decoding: true
  extra_values: null
  replica_count: 4

training_infra:
  training_shape_id: accounts/fireworks/trainingShapes/qwen3p5-9b-256k-lora
  training_job_id: null
  region: null
  custom_image_tag: null
  accelerator_type: null
  accelerator_count: null
  skip_validations: false
  node_count: 2
  extra_args: null

teacher_training_infra:
  training_shape_id: accounts/fireworks/trainingShapes/qwen3p5-9b-256k-lora
  training_job_id: null
  region: null
  custom_image_tag: null
  accelerator_type: null
  accelerator_count: null
  skip_validations: false
  node_count: 1
  extra_args: null

train_display_name: "tinker-open-thoughts-qwen3p5-9b-merged"
teacher_display_name: "qwen3p5-9b"
