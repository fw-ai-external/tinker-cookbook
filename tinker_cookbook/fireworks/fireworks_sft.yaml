# Fireworks-specific settings for SFT setup.
fireworks_base_url: "https://api.fireworks.ai"

account: null  # Fireworks account ID (falls back to FIREWORKS_ACCOUNT_ID env var)

model:
  name: accounts/fireworks/models/kimi-k2p6
  lora_rank: 32

training:
  learning_rate: 1e-5
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  weight_decay: 0.01
  grad_clip_norm: 1.0
  max_length: null  # Auto-derived from training shape if null

training_infra:
  training_shape_id: accounts/fireworks/trainingShapes/kimi-k2p6-text-only-256k-lora
  training_job_id: null
  region: null
  custom_image_tag: null
  accelerator_type: null
  accelerator_count: null
  skip_validations: false
  node_count: 1
  extra_args: null

train_display_name: "qwen3p5-27b-policy"
